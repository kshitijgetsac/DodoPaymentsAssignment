services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: invoices
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoices -d invoices"]
      interval: 2s
      timeout: 3s
      retries: 20

  psp:
    build: .
    command: ["psp"]
    ports:
      - "8081:8081"

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://invoices:invoices@db:5432/invoices
      PSP_URL: http://psp:8081
      DEV_API_KEY: dodo_test_dev_secret_change_me
      WEBHOOK_MASTER_KEY: dodo-local-development-master-key
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      psp:
        condition: service_started
